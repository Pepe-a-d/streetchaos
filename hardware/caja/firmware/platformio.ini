; Firmware de la caja DIY: SparkFun Thing Plus ESP32-S3 (patillas en ../conexiones.md).
; Lo compila GitHub al publicar (.github/workflows/publicar.yml) y la página
; https://pepe-a-d.github.io/streetchaos/caja/ lo instala desde Chrome, sin instalar nada en el Mac.
;
;   pio run -e prueba     la prueba de banco (H1)
;   pio test -e native    las pruebas en el ordenador (lib/ubx y lib/banco), sin placa

[platformio]
default_envs = prueba

[esp32]
platform = espressif32 @ 8.0.0
framework = arduino
board = sparkfun_esp32s3_thing_plus
monitor_speed = 115200
; La consola va por el USB de la placa (el del propio ESP32-S3)
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -Wall

[env:prueba]
extends = esp32
build_src_filter = +<prueba/>
build_flags =
  ${esp32.build_flags}
  -DFW_VERSION=\"1.0.0\"

[env:native]
platform = native @ 1.2.1
test_build_src = no
build_flags = -std=c++17 -Wall -Wextra
