  <text x="620" y="414" font-size="11" fill="#455a64">Pasamuros de la antena, centrado, a 40 mm del suelo:</text>
  <text x="620" y="429" font-size="11" fill="#455a64">así queda por encima del GPS, que va sobre separadores.</text>
  <text x="620" y="444" font-size="11" fill="#455a64">Junta tórica por fuera y tuerca por dentro.</text>
