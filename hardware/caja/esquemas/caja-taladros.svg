  <text x="70" y="414" font-size="11" fill="#455a64">Prensaestopas: cable de la moto y cable de revoluciones.</text>
  <text x="70" y="429" font-size="11" fill="#455a64">Membrana de ventilación en el centro: deja salir la humedad.</text>
  <text x="70" y="444" font-size="11" fill="#455a64">Los tres a 32 mm del suelo; los prensaestopas a 22 mm del centro.</text>
