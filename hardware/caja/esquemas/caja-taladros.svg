  <text x="30" y="34" font-size="20" fill="#111" font-weight="bold">Caja: agujeros y anclaje (Hammond 1555F2F42GY)</text>
  <text x="30" y="56" font-size="12" fill="#555">Medidas en mm, desde el suelo de la caja montada (la cara de abajo de la tapa con pestañas). Los agujeros van en el cuerpo, nunca en la cara de arriba.</text>
