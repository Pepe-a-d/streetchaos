  <text x="260.20000000000005" y="581.2" font-size="13" fill="#c62828" font-weight="bold">ADELANTE</text>
  <text x="70" y="878.4000000000001" font-size="11" fill="#455a64">4 agujeros de Ø5 y 2 ranuras de Ø8,5 en las pestañas: bridas de seguridad, o tornillos M4</text>
  <text x="70" y="893.4000000000001" font-size="11" fill="#455a64">con arandela ancha y tuerca autoblocante si taladras la bandeja de la moto.</text>
