  <text x="690" y="790" font-size="11" fill="#455a64">Dual Lock (azul) y dos bridas por las pestañas. Sin gomas ni espuma gruesa.</text>
  <text x="690" y="805" font-size="11" fill="#455a64">La antena, mirando al cielo, bajo plástico y nunca debajo de ti.</text>
