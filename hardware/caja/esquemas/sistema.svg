<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="620" fill="#ffffff"/>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="20" font-weight="bold" fill="#111">Caja Street Chaos en la Ninja 125: las dos unidades y la moto</text>

  <!-- Antena -->
  <rect x="460" y="52" width="300" height="52" rx="6" fill="#f3f0ff" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="474" y="73" font-size="13" font-weight="bold" fill="#311b92">Antena GNSS activa (cable de 3 m)</text>
  <text x="474" y="92" font-size="11" fill="#333">bajo el asiento del pasajero, a más de 20 cm de la caja</text>
  <line x1="700" y1="104" x2="700" y2="172" stroke="#424242" stroke-width="3"/>
  <line x1="700" y1="104" x2="700" y2="172" stroke="#bdbdbd" stroke-width="1"/>
  <text x="706" y="150" font-size="11" fill="#424242">SMA</text>

  <!-- CAJA -->
  <rect x="440" y="120" width="340" height="480" rx="10" fill="#fafafa" stroke="#212121" stroke-width="2.5"/>
  <text x="456" y="142" font-size="15" font-weight="bold" fill="#111">CAJA · bajo el asiento</text>
  <text x="456" y="160" font-size="12" fill="#555">Hammond 1555F2F42GY · IP68</text>

  <rect x="460" y="172" width="300" height="44" rx="5" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="472" y="190" font-size="13" font-weight="bold" fill="#0d47a1">GPS u-blox NEO-M9N</text>
  <text x="472" y="207" font-size="11" fill="#333">25 Hz · PPS al GPIO 4 · UART</text>

  <rect x="460" y="224" width="300" height="44" rx="5" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="472" y="242" font-size="13" font-weight="bold" fill="#0d47a1">Sensor de movimiento ISM330DHCX</text>
  <text x="472" y="259" font-size="11" fill="#333">6 ejes · en el centro de la placa · I2C</text>

  <rect x="460" y="276" width="300" height="56" rx="5" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="472" y="296" font-size="13" font-weight="bold" fill="#1b5e20">ESP32-S3 · SparkFun Thing Plus</text>
  <text x="472" y="313" font-size="11" fill="#333">microSD · WiFi a casa · ESP-NOW a la pantalla</text>
  <text x="472" y="327" font-size="11" fill="#333">graba .scb (formato de la caja negra)</text>

  <rect x="460" y="340" width="300" height="128" rx="5" fill="#fff8e1" stroke="#f9a825"/>
  <text x="472" y="360" font-size="13" font-weight="bold" fill="#e65100">Entradas</text>
  <text x="472" y="380" font-size="11" fill="#333">contacto y freno: optoacopladores PC817</text>
  <text x="472" y="398" font-size="11" fill="#333">revoluciones: filtro + disparador 74HC14</text>
  <text x="472" y="416" font-size="11" fill="#333">la moto nunca toca una patilla del ESP32</text>

  <rect x="460" y="476" width="300" height="104" rx="5" fill="#ffebee" stroke="#c62828"/>
  <text x="472" y="496" font-size="13" font-weight="bold" fill="#b71c1c">Alimentación</text>
  <text x="472" y="514" font-size="11" fill="#333">TVS 1.5KE22A · interruptor Pololu 2809</text>
  <text x="472" y="532" font-size="11" fill="#333">regulador 12 → 5 V Pololu D36V28F5</text>
  <text x="472" y="550" font-size="11" fill="#333">la enciende el contacto y se apaga sola</text>
  <text x="472" y="568" font-size="11" fill="#333">apagada: no gasta nada</text>

  <!-- MOTO: piloto -->
  <rect x="30" y="340" width="200" height="74" rx="6" fill="#ffffff" stroke="#616161" stroke-width="1.5"/>
  <text x="44" y="362" font-size="13" font-weight="bold" fill="#111">Piloto trasero</text>
  <text x="44" y="380" font-size="11" fill="#333">posición y freno</text>
  <text x="44" y="398" font-size="11" fill="#333">Posi-Tap + 1 kΩ</text>
  <line x1="230" y1="372" x2="460" y2="372" stroke="#2e7d32" stroke-width="3"/>
  <text x="248" y="366" font-size="11" fill="#2e7d32">verde · CONT (luz de posición)</text>
  <line x1="230" y1="402" x2="460" y2="402" stroke="#c49000" stroke-width="3"/>
  <text x="248" y="396" font-size="11" fill="#8a6500">amarillo · FRENO</text>

  <!-- MOTO: bobina -->
  <rect x="30" y="426" width="200" height="60" rx="6" fill="#ffffff" stroke="#616161" stroke-width="1.5"/>
  <text x="44" y="448" font-size="13" font-weight="bold" fill="#111">Bobina de encendido</text>
  <text x="44" y="466" font-size="11" fill="#333">8-10 vueltas en el cable de bujía</text>
  <line x1="230" y1="452" x2="460" y2="452" stroke="#212121" stroke-width="4"/>
  <line x1="230" y1="452" x2="460" y2="452" stroke="#ffffff" stroke-width="1.5"/>
  <text x="248" y="446" font-size="11" fill="#212121">apantallado · RPM</text>

  <!-- MOTO: batería -->
  <rect x="30" y="496" width="200" height="80" rx="6" fill="#ffffff" stroke="#616161" stroke-width="1.5"/>
  <text x="44" y="518" font-size="13" font-weight="bold" fill="#111">Batería 12 V</text>
  <text x="44" y="536" font-size="11" fill="#333">YTX7A-BS, bajo el asiento</text>
  <text x="212" y="521" font-size="14" font-weight="bold" fill="#c62828">+</text>
  <text x="213" y="561" font-size="14" font-weight="bold" fill="#333">−</text>
  <line x1="230" y1="516" x2="300" y2="516" stroke="#8d5524" stroke-width="3"/>
  <rect x="300" y="506" width="56" height="20" rx="3" fill="#ffffff" stroke="#c62828" stroke-width="1.5"/>
  <text x="309" y="520" font-size="11" font-weight="bold" fill="#c62828">F1 2 A</text>
  <line x1="356" y1="516" x2="460" y2="516" stroke="#8d5524" stroke-width="3"/>
  <text x="362" y="509" font-size="11" fill="#8d5524">marrón · +12 V</text>
  <line x1="230" y1="556" x2="460" y2="556" stroke="#9e9e9e" stroke-width="3"/>
  <text x="248" y="550" font-size="11" fill="#616161">blanco · GND</text>

  <!-- PANTALLA -->
  <rect x="840" y="240" width="240" height="190" rx="10" fill="#fafafa" stroke="#212121" stroke-width="2.5"/>
  <text x="854" y="264" font-size="15" font-weight="bold" fill="#111">PANTALLA · Quad Lock</text>
  <text x="854" y="288" font-size="11" fill="#333">Sharp Memory 2,7" (se lee al sol)</text>
  <text x="854" y="308" font-size="11" fill="#333">8 LEDs: aviso de cambio y delta</text>
  <text x="854" y="328" font-size="11" fill="#333">botón A: pantalla · botón B: marca</text>
  <text x="854" y="348" font-size="11" fill="#333">sensor de luz (brillo de los LEDs)</text>
  <text x="854" y="368" font-size="11" fill="#333">batería LiPo 2000 mAh</text>
  <text x="854" y="388" font-size="11" fill="#333">USB-C para cargar en casa</text>
  <text x="854" y="412" font-size="11" fill="#555">ESP32-S3 · SparkFun Thing Plus</text>
  <line x1="760" y1="300" x2="840" y2="300" stroke="#7b1fa2" stroke-width="2.5" stroke-dasharray="7,5"/>
  <text x="784" y="292" font-size="11" fill="#7b1fa2">ESP-NOW</text>
  <text x="790" y="316" font-size="10" fill="#7b1fa2">radio</text>

  <!-- NUBE -->
  <rect x="840" y="470" width="240" height="96" rx="8" fill="#f1f8e9" stroke="#558b2f" stroke-width="1.5"/>
  <text x="854" y="492" font-size="13" font-weight="bold" fill="#33691e">Aparcada en casa: WiFi</text>
  <text x="854" y="511" font-size="11" fill="#333">nube: función caja-negra</text>
  <text x="854" y="528" font-size="11" fill="#333">→ Blackbox (web y escritorio)</text>
  <text x="854" y="548" font-size="11" fill="#333">o la microSD: arrastrar el .scb</text>
  <path d="M760,322 L812,322 L812,518 L838,518" fill="none" stroke="#558b2f" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#flecha)"/>
</svg>
