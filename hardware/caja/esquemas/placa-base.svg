  <text x="30" y="34" font-size="20" fill="#111" font-weight="bold">Caja: distribución de la placa base (vista desde arriba, a escala)</text>
  <text x="30" y="56" font-size="12" fill="#555">Orientativo: presenta todas las piezas antes de soldar y comprueba que la caja cierra. Medidas en mm.</text>
