  <rect x="245" y="285" width="106.8" height="121.8" rx="2" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
  <text x="298.4" y="336.9" font-size="10.5" fill="#212121" font-weight="bold" text-anchor="middle">U5</text>
  <text x="298.4" y="349.9" font-size="10.5" fill="#212121" text-anchor="middle">regulador</text>
  <text x="298.4" y="362.9" font-size="10.5" fill="#212121" text-anchor="middle">5 V</text>
  <rect x="245" y="417" width="91.2" height="106.8" rx="2" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
  <text x="290.6" y="467.9" font-size="10.5" fill="#212121" font-weight="bold" text-anchor="middle">U4</text>
  <text x="290.6" y="480.9" font-size="10.5" fill="#212121" text-anchor="middle">interruptor</text>
  <circle cx="374" cy="306" r="19.2" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="374" y="310" font-size="10" fill="#222" text-anchor="middle">C1</text>
  <rect x="353" y="342" width="45" height="18" rx="2" fill="#212121" stroke="#212121" stroke-width="1.6"/>
  <text x="375.2" y="381" font-size="10" fill="#222" text-anchor="middle">D2</text>
  <rect x="356" y="399" width="15" height="48" rx="2" fill="#d7ccc8" stroke="#5d4037" stroke-width="1"/>
  <rect x="380" y="399" width="15" height="48" rx="2" fill="#d7ccc8" stroke="#5d4037" stroke-width="1"/>
  <rect x="359" y="465" width="30" height="15" rx="2" fill="#fff59d" stroke="#f9a825" stroke-width="1"/>
  <text x="375.2" y="507" font-size="9.5" fill="#222" text-anchor="middle">R8 R9 C4</text>
  <rect x="407" y="285" width="106.8" height="152.4" rx="2" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="460.4" y="321" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">U3 IMU</text>
  <text x="460.4" y="345" font-size="10" fill="#0d47a1" text-anchor="middle">pegada</text>
  <line x1="497" y1="387" x2="425" y2="387" stroke="#0d47a1" stroke-width="2.4" marker-end="url(#fl)"/>
  <text x="460.4" y="420" font-size="10" fill="#0d47a1" text-anchor="middle">X adelante</text>
  <rect x="407" y="456" width="246" height="117" rx="2" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="464" y="483" font-size="10.5" fill="#4a148c" font-weight="bold" text-anchor="middle">optoacopladores</text>
  <text x="464" y="496" font-size="10.5" fill="#4a148c" text-anchor="middle">U6, U7, R1-R5,</text>
  <text x="464" y="509" font-size="10.5" fill="#4a148c" text-anchor="middle">D3, D4</text>
  <text x="464" y="522" font-size="10.5" fill="#4a148c" text-anchor="middle">(bajo el GPS)</text>
  <rect x="527" y="285" width="220.8" height="243.6" rx="2" fill="none" stroke="#1565c0" stroke-width="2.4" stroke-dasharray="8,5"/>
  <circle cx="542.2" cy="300.2" r="15.6" fill="#bbdefb" stroke="#0d47a1" stroke-width="1.4"/>
  <circle cx="732.6" cy="300.2" r="15.6" fill="#bbdefb" stroke="#0d47a1" stroke-width="1.4"/>
  <circle cx="542.2" cy="513.4" r="15.6" fill="#bbdefb" stroke="#0d47a1" stroke-width="1.4"/>
  <circle cx="732.6" cy="513.4" r="15.6" fill="#bbdefb" stroke="#0d47a1" stroke-width="1.4"/>
  <text x="637.4" y="351" font-size="12" fill="#0d47a1" font-weight="bold" text-anchor="middle">U2 GPS</text>
  <text x="637.4" y="378" font-size="10.5" fill="#0d47a1" text-anchor="middle">por encima, sobre</text>
  <text x="637.4" y="400.8" font-size="10.5" fill="#0d47a1" text-anchor="middle">separadores de 15 mm</text>
  <rect x="491" y="390" width="36" height="30" rx="2" fill="#ffd54f" stroke="#f57f17" stroke-width="1.6"/>
  <text x="509" y="383.4" font-size="10" fill="#e65100" font-weight="bold" text-anchor="middle">SMA</text>
  <text x="637.4" y="441" font-size="10" fill="#0d47a1" text-anchor="middle">conector SMA hacia dentro,</text>
  <text x="637.4" y="462.6" font-size="10" fill="#0d47a1" text-anchor="middle">nunca contra la pared</text>
  <line x1="70" y1="345" x2="143" y2="345" stroke="#37474f" stroke-width="2" marker-end="url(#fl)"/>
  <text x="30" y="261" font-size="10.5" fill="#37474f">pared</text>
  <text x="30" y="275" font-size="10.5" fill="#37474f">delantera:</text>
  <text x="30" y="289" font-size="10.5" fill="#37474f">2 prensa-</text>
  <text x="30" y="303" font-size="10.5" fill="#37474f">estopas y</text>
  <text x="30" y="317" font-size="10.5" fill="#37474f">membrana</text>
  <text x="794" y="285" font-size="10.5" fill="#37474f">pared trasera:</text>
  <text x="794" y="299" font-size="10.5" fill="#37474f">pasamuros SMA</text>
  <line x1="257" y1="677" x2="161" y2="677" stroke="#c62828" stroke-width="3" marker-end="url(#fl)"/>
  <text x="266" y="682" font-size="13" fill="#c62828" font-weight="bold">ADELANTE (hacia la parte delantera de la moto)</text>
  <line x1="149" y1="619" x2="749" y2="619" stroke="#607d8b" stroke-width="1"/>
  <text x="449" y="615" font-size="11" fill="#455a64" text-anchor="middle">100</text>
  <line x1="218" y1="635" x2="680" y2="635" stroke="#607d8b" stroke-width="1"/>
  <text x="449" y="649" font-size="11" fill="#455a64" text-anchor="middle">77 entre agujeros</text>
  <text x="900" y="110" font-size="15" fill="#263238" font-weight="bold">Qué va en cada zona</text>
  <text x="900" y="136" font-size="12" fill="#37474f" font-weight="bold">Placa</text>
  <text x="900" y="152" font-size="11" fill="#455a64">Perforada de doble cara, 100 × 80 mm. 4</text>
  <text x="900" y="166" font-size="11" fill="#455a64">agujeros de 3,2 mm a 77 × 68 mm, a la tapa</text>
  <text x="900" y="180" font-size="11" fill="#455a64">con separadores de 6 mm y tornillos ST2,9 ×</text>
  <text x="900" y="194" font-size="11" fill="#455a64">13.</text>
  <text x="900" y="216" font-size="12" fill="#37474f" font-weight="bold">U1</text>
  <text x="900" y="232" font-size="11" fill="#455a64">Sobre zócalos hembra. Debajo, en el lado del</text>
  <text x="900" y="246" font-size="11" fill="#455a64">USB, está la ranura de la microSD: deja esa</text>
  <text x="900" y="260" font-size="11" fill="#455a64">zona libre para sacar la tarjeta.</text>
  <text x="900" y="282" font-size="12" fill="#37474f" font-weight="bold">Revoluciones</text>
  <text x="900" y="298" font-size="11" fill="#455a64">Debajo de U1, en el lado del módulo. Solo</text>
  <text x="900" y="312" font-size="11" fill="#455a64">piezas bajas: entre la placa perforada y U1</text>
  <text x="900" y="326" font-size="11" fill="#455a64">quedan unos 6 mm.</text>
  <text x="900" y="348" font-size="12" fill="#37474f" font-weight="bold">Alimentación</text>
  <text x="900" y="364" font-size="11" fill="#455a64">Junto a las bornas: los cables gruesos,</text>
  <text x="900" y="378" font-size="11" fill="#455a64">cortos.</text>
  <text x="900" y="400" font-size="12" fill="#37474f" font-weight="bold">IMU (U3)</text>
  <text x="900" y="416" font-size="11" fill="#455a64">Soldada pegada a la placa, en el centro,</text>
  <text x="900" y="430" font-size="11" fill="#455a64">entre los cuatro tornillos. Su flecha X</text>
  <text x="900" y="444" font-size="11" fill="#455a64">hacia las bornas.</text>
  <text x="900" y="466" font-size="12" fill="#37474f" font-weight="bold">Optoacopladores</text>
  <text x="900" y="482" font-size="11" fill="#455a64">En la zona de abajo a la derecha. Deja libre</text>
  <text x="900" y="496" font-size="11" fill="#455a64">el sitio de los dos separadores del GPS.</text>
  <text x="900" y="518" font-size="12" fill="#37474f" font-weight="bold">GPS (U2)</text>
  <text x="900" y="534" font-size="11" fill="#455a64">Lo último: encima de todo, con su conector</text>
  <text x="900" y="548" font-size="11" fill="#455a64">SMA hacia dentro. El latiguillo sube y va al</text>
  <text x="900" y="562" font-size="11" fill="#455a64">pasamuros de la pared trasera.</text>
</svg>
