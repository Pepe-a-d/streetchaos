  <rect x="281" y="150" width="114" height="93" rx="2" fill="#fffde7" stroke="#f9a825" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="338" y="187.5" font-size="10.5" fill="#212121" font-weight="bold" text-anchor="middle">microSD</text>
  <text x="338" y="200.5" font-size="10.5" fill="#212121" text-anchor="middle">por debajo:</text>
  <text x="338" y="213.5" font-size="10.5" fill="#212121" text-anchor="middle">zona libre</text>
  <rect x="404" y="150" width="213" height="93" rx="2" fill="#f1f8e9" stroke="#558b2f" stroke-width="1.6" stroke-dasharray="4,3"/>
  <text x="510.5" y="187.5" font-size="10.5" fill="#212121" font-weight="bold" text-anchor="middle">debajo de U1: revoluciones</text>
  <text x="510.5" y="200.5" font-size="10.5" fill="#212121" text-anchor="middle">U8, R6, R7, R10, D5, D6, C2, C3</text>
  <text x="510.5" y="213.5" font-size="10.5" fill="#212121" text-anchor="middle">solo piezas bajas (&lt; 6 mm)</text>
  <text x="449" y="125.2" font-size="11.5" fill="#1b5e20" font-weight="bold" text-anchor="middle">U1 · Thing Plus ESP32-S3, sobre zócalos hembra (8,5 mm)</text>
  <rect x="158" y="285" width="48" height="91.4" rx="2" fill="#81c784" stroke="#2e7d32" stroke-width="1.6"/>
  <rect x="158" y="393" width="48" height="91.4" rx="2" fill="#81c784" stroke="#2e7d32" stroke-width="1.6"/>
