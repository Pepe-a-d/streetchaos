  <text x="30" y="34" font-size="20" fill="#111" font-weight="bold">Unidad de pantalla: distribución y conexiones</text>
  <text x="30" y="56" font-size="12" fill="#555">Caja Hammond RP1085C con tapa transparente delante. Va en el Quad Lock con el amortiguador. Medidas en mm.</text>
  <text x="60" y="106" font-size="14" fill="#263238" font-weight="bold">De frente, a través de la tapa transparente</text>
  <text x="60" y="122" font-size="11" fill="#607d8b">Línea continua: junto a la tapa · discontinua: al fondo</text>
