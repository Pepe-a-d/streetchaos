  <text x="1040" y="654" font-size="10.5" fill="#222">el otro terminal</text>
  <line x1="1190" y1="650" x2="1208" y2="650" stroke="#999" stroke-width="1"/>
  <rect x="1208" y="641" width="34" height="18" rx="9" fill="#f5f5f5" stroke="#616161" stroke-width="1.3"/>
  <text x="1225" y="654" font-size="11" fill="#424242" font-weight="bold" text-anchor="middle">GND</text>
  <text x="1040" y="666" font-size="10" fill="#666">pull-up interna del ESP32</text>
  <text x="780" y="712" font-size="11" fill="#455a64">U14 VEML7700: cable Qwiic a U11 (0x10). Su VIN (3V3_P) alimenta también la pantalla:</text>
  <text x="780" y="728" font-size="11" fill="#455a64">en U11 se corta LP_CTL y la pantalla se queda sin corriente al dormir.</text>
  <text x="780" y="746" font-size="11" fill="#455a64">BT1 LiPo 2000 mAh: al conector de batería de U11. Comprueba la polaridad antes.</text>
  <text x="780" y="764" font-size="11" fill="#455a64">Los LEDs van a la batería (VBAT) a través de U15: apagados gastan</text>
  <text x="780" y="780" font-size="11" fill="#455a64">~0,5 mA cada uno y sin U15 vaciarían la batería en días.</text>
