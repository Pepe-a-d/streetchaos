  <text x="619.5" y="450" font-size="12" fill="#263238" font-weight="bold">B · MARCA</text>
  <text x="60" y="587.5" font-size="11" fill="#455a64">Por detrás: chapa de aluminio de 80 × 60 atornillada (4 × M3 a 66 × 40 mm)</text>
  <text x="60" y="603.5" font-size="11" fill="#455a64">y el adaptador Quad Lock Original pegado en medio, entre los tornillos.</text>
  <text x="60" y="619.5" font-size="11" fill="#455a64">Pantalla sobre separadores (unos 20 mm): el cristal a 1-2 mm de la tapa.</text>
  <text x="60" y="635.5" font-size="11" fill="#455a64">Vinilo negro por dentro de la tapa: tapa el borde de la pantalla.</text>
  <text x="60" y="651.5" font-size="11" fill="#455a64">Pulsadores de Ø16 en la pared derecha. B: corta = marca, larga = meta.</text>
