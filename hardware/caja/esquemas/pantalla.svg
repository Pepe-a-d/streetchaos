<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="1320" height="900" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" fill="#111" font-weight="bold">Unidad de pantalla: distribución y conexiones</text>
  <text x="30" y="56" font-size="12" fill="#555">Riverdi 4,3" (1000 nits) en una carcasa impresa en ASA. Va en el Quad Lock con el amortiguador y toma la corriente de la caja por cable. Medidas en mm.</text>

  <!-- Vista de frente, escala 3,5 px/mm, centro de la pantalla en (300, 420) -->
  <text x="60" y="106" font-size="14" fill="#263238" font-weight="bold">De frente (a escala)</text>
  <text x="60" y="122" font-size="11" fill="#607d8b">Carcasa de unos 116 × 98 × 36 mm. Línea discontinua: por dentro o por detrás</text>
  <rect x="97" y="241.5" width="406" height="343" rx="14" fill="#eceff1" stroke="#37474f" stroke-width="2.2"/>
  <!-- marco y orejetas de la Riverdi (por dentro) -->
  <rect x="114" y="301" width="372" height="238" rx="2" fill="none" stroke="#90a4ae" stroke-width="1.4" stroke-dasharray="5,4"/>
  <rect x="131.5" y="273" width="28" height="28" fill="none" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="440.5" y="273" width="28" height="28" fill="none" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="131.5" y="539" width="28" height="28" fill="none" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="440.5" y="539" width="28" height="28" fill="none" stroke="#90a4ae" stroke-width="1.2" stroke-dasharray="4,3"/>
  <circle cx="145.5" cy="286.2" r="6" fill="#fff" stroke="#455a64" stroke-width="1.2"/>
  <circle cx="454.5" cy="286.2" r="6" fill="#fff" stroke="#455a64" stroke-width="1.2"/>
  <circle cx="145.5" cy="553.8" r="6" fill="#fff" stroke="#455a64" stroke-width="1.2"/>
  <circle cx="454.5" cy="553.8" r="6" fill="#fff" stroke="#455a64" stroke-width="1.2"/>
  <!-- ventana de la pantalla -->
  <rect x="130" y="321.5" width="340" height="197" rx="2" fill="#263238" stroke="#212121" stroke-width="1.6"/>
  <text x="300" y="402" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">U12 · Riverdi RVT43HLBFWN00</text>
  <text x="300" y="422" font-size="11" fill="#cfd8dc" text-anchor="middle">4,3" IPS · 480 × 272 · 1000 nits · antirreflejos</text>
  <text x="300" y="440" font-size="11" fill="#cfd8dc" text-anchor="middle">zona visible 95 × 54 · hueco del marco 97 × 56</text>
  <text x="300" y="458" font-size="11" fill="#cfd8dc" text-anchor="middle">junta de TPU alrededor, sin cristal delante</text>
  <!-- tira de LEDs -->
  <rect x="210.6" y="259" width="179" height="36" rx="3" fill="#212121" stroke="#212121" stroke-width="1.4"/>
  <circle cx="222.3" cy="277" r="8.5" fill="#43a047"/>
  <circle cx="244.5" cy="277" r="8.5" fill="#43a047"/>
  <circle cx="266.8" cy="277" r="8.5" fill="#43a047"/>
  <circle cx="289" cy="277" r="8.5" fill="#fdd835"/>
  <circle cx="311.2" cy="277" r="8.5" fill="#fdd835"/>
  <circle cx="333.5" cy="277" r="8.5" fill="#fb8c00"/>
  <circle cx="355.7" cy="277" r="8.5" fill="#e53935"/>
  <circle cx="378" cy="277" r="8.5" fill="#e53935"/>
  <text x="300" y="214" font-size="11" fill="#37474f" font-weight="bold" text-anchor="middle">U13 · 8 LEDs tras una ventana de policarbonato</text>
  <!-- sensor de luz en la pared de arriba -->
  <rect x="405" y="235" width="42" height="12" rx="2" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6"/>
  <text x="453" y="232" font-size="10" fill="#e65100">U14, arriba</text>
  <!-- botones en la pared derecha -->
  <circle cx="503" cy="357" r="28" fill="#cfd8dc" stroke="#263238" stroke-width="2"/>
  <circle cx="503" cy="357" r="19" fill="#90a4ae" stroke="#263238" stroke-width="1.4"/>
  <text x="540" y="361" font-size="12" fill="#263238" font-weight="bold">A · PANTALLA</text>
  <circle cx="503" cy="483" r="28" fill="#cfd8dc" stroke="#263238" stroke-width="2"/>
  <circle cx="503" cy="483" r="19" fill="#90a4ae" stroke="#263238" stroke-width="1.4"/>
  <text x="540" y="487" font-size="12" fill="#263238" font-weight="bold">B · MARCA</text>
  <!-- Quad Lock por detrás -->
  <rect x="216" y="314" width="168" height="210" rx="8" fill="none" stroke="#ce93d8" stroke-width="1.2" stroke-dasharray="7,5"/>
  <!-- prensaestopas y conector -->
  <rect x="186" y="584.5" width="28" height="16" rx="3" fill="#a5d6a7" stroke="#2e7d32" stroke-width="1.4"/>
  <line x1="200" y1="600.5" x2="200" y2="640" stroke="#8d5524" stroke-width="3"/>
  <rect x="184" y="640" width="32" height="22" rx="4" fill="#b0bec5" stroke="#455a64" stroke-width="1.4"/>
  <text x="226" y="656" font-size="11" fill="#37474f">SP13 → cable de 12 V de la caja (marrón 1, blanco 2)</text>
  <text x="226" y="598" font-size="10" fill="#2e7d32">prensaestopas PG7</text>

  <text x="60" y="702" font-size="11" fill="#455a64">La pantalla se atornilla por sus 4 orejetas (agujeros de 3,5 mm a 88,3 × 76,5) a insertos M3 de la carcasa.</text>
  <text x="60" y="718" font-size="11" fill="#455a64">Botones de Ø16 en la pared derecha, por detrás de la pantalla. B: corta = marca, larga = meta.</text>
  <text x="60" y="734" font-size="11" fill="#455a64">Sensor de luz en la pared de arriba, tras una ventanita: mide el cielo y ajusta el brillo.</text>
  <text x="60" y="750" font-size="11" fill="#455a64">Por detrás: la placa U11, la Break Out Board 20 y la placa de alimentación (U16, U17).</text>
  <text x="60" y="766" font-size="11" fill="#7b1fa2">En morado, por detrás: la chapa de aluminio (80 × 60) atornillada a insertos, y el Quad Lock pegado en medio.</text>

  <!-- Conexiones -->
  <rect x="760" y="76" width="540" height="816" rx="8" fill="#ffffff" stroke="#cfd8dc" stroke-width="1.4"/>
  <text x="772" y="98" font-size="15" fill="#263238" font-weight="bold">Conexiones</text>

  <!-- U11 -->
  <rect x="930" y="114" width="200" height="200" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6"/>
  <text x="1030" y="134" font-size="12" fill="#1b5e20" font-weight="bold" text-anchor="middle">U11 · Thing Plus ESP32-S3</text>
  <text x="938" y="160" font-size="10.5" fill="#222">VUSB</text>
  <line x1="912" y1="156" x2="930" y2="156" stroke="#222" stroke-width="1.6"/>
  <rect x="868" y="147" width="44" height="18" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="1.3"/>
  <text x="890" y="160" font-size="11" fill="#b71c1c" font-weight="bold" text-anchor="middle">VUSB</text>
  <text x="938" y="184" font-size="10.5" fill="#222">3V3</text>
  <line x1="912" y1="180" x2="930" y2="180" stroke="#222" stroke-width="1.6"/>
  <rect x="878" y="171" width="34" height="18" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="1.3"/>
  <text x="895" y="184" font-size="11" fill="#b71c1c" font-weight="bold" text-anchor="middle">3V3</text>
  <text x="938" y="208" font-size="10.5" fill="#222">GND</text>
  <line x1="912" y1="204" x2="930" y2="204" stroke="#222" stroke-width="1.6"/>
  <rect x="878" y="195" width="34" height="18" rx="9" fill="#f5f5f5" stroke="#616161" stroke-width="1.3"/>
  <text x="895" y="208" font-size="11" fill="#424242" font-weight="bold" text-anchor="middle">GND</text>
  <text x="938" y="232" font-size="10.5" fill="#222">SCK · 12</text>
  <line x1="912" y1="228" x2="930" y2="228" stroke="#222" stroke-width="1.6"/>
  <rect x="878" y="219" width="34" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="895" y="232" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">SCK</text>
  <text x="938" y="256" font-size="10.5" fill="#222">PICO · 11</text>
  <line x1="912" y1="252" x2="930" y2="252" stroke="#222" stroke-width="1.6"/>
  <rect x="872" y="243" width="40" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="892" y="256" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">MOSI</text>
  <text x="938" y="280" font-size="10.5" fill="#222">POCI · 13</text>
  <line x1="912" y1="276" x2="930" y2="276" stroke="#222" stroke-width="1.6"/>
  <rect x="872" y="267" width="40" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="892" y="280" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">MISO</text>
  <text x="938" y="304" font-size="10.5" fill="#222">A0 · 10</text>
  <line x1="912" y1="300" x2="930" y2="300" stroke="#222" stroke-width="1.6"/>
  <rect x="885" y="291" width="27" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="898.5" y="304" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">CS</text>
  <text x="1122" y="160" font-size="10.5" fill="#222" text-anchor="end">GPIO 5</text>
  <line x1="1130" y1="156" x2="1148" y2="156" stroke="#222" stroke-width="1.6"/>
  <rect x="1148" y="147" width="30" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="1163" y="160" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">PD</text>
  <text x="1122" y="184" font-size="10.5" fill="#222" text-anchor="end">GPIO 4</text>
  <line x1="1130" y1="180" x2="1148" y2="180" stroke="#222" stroke-width="1.6"/>
  <rect x="1148" y="171" width="34" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="1165" y="184" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">INT</text>
  <text x="1122" y="208" font-size="10.5" fill="#222" text-anchor="end">GPIO 21</text>
  <line x1="1130" y1="204" x2="1148" y2="204" stroke="#222" stroke-width="1.6"/>
  <rect x="1148" y="195" width="68" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="1182" y="208" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">LED_3V3</text>
  <text x="1122" y="232" font-size="10.5" fill="#222" text-anchor="end">GPIO 7</text>
  <line x1="1130" y1="228" x2="1148" y2="228" stroke="#222" stroke-width="1.6"/>
  <rect x="1148" y="219" width="47" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="1171.5" y="232" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">BTN_A</text>
  <text x="1122" y="256" font-size="10.5" fill="#222" text-anchor="end">GPIO 6</text>
  <line x1="1130" y1="252" x2="1148" y2="252" stroke="#222" stroke-width="1.6"/>
  <rect x="1148" y="243" width="47" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="1171.5" y="256" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">BTN_B</text>
  <text x="1122" y="284" font-size="10.5" fill="#555" text-anchor="end">Qwiic → U14 (0x10)</text>
  <text x="1122" y="302" font-size="10.5" fill="#555" text-anchor="end">LP_CTL sin cortar</text>

  <!-- U12 RiBUS -->
  <rect x="780" y="334" width="250" height="232" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <text x="790" y="354" font-size="12" fill="#1565c0" font-weight="bold">U12 · Riverdi (Break Out Board 20)</text>
  <text x="790" y="380" font-size="10.5" fill="#222">1  VDD</text>
  <rect x="980" y="367" width="34" height="18" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="1.3"/>
  <text x="997" y="380" font-size="11" fill="#b71c1c" font-weight="bold" text-anchor="middle">3V3</text>
  <text x="790" y="398" font-size="10.5" fill="#222">2  GND</text>
  <rect x="980" y="385" width="34" height="18" rx="9" fill="#f5f5f5" stroke="#616161" stroke-width="1.3"/>
  <text x="997" y="398" font-size="11" fill="#424242" font-weight="bold" text-anchor="middle">GND</text>
  <text x="790" y="416" font-size="10.5" fill="#222">3  SPI_SCLK</text>
  <rect x="980" y="403" width="34" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="997" y="416" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">SCK</text>
  <text x="790" y="434" font-size="10.5" fill="#222">4  MISO</text>
  <rect x="976" y="421" width="40" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="996" y="434" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">MISO</text>
  <text x="790" y="452" font-size="10.5" fill="#222">5  MOSI</text>
  <rect x="976" y="439" width="40" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="996" y="452" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">MOSI</text>
  <text x="790" y="470" font-size="10.5" fill="#222">6  CS (activo en bajo)</text>
  <rect x="983" y="457" width="27" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="996.5" y="470" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">CS</text>
  <text x="790" y="488" font-size="10.5" fill="#222">7  INT</text>
  <rect x="980" y="475" width="34" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="997" y="488" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">INT</text>
  <text x="790" y="506" font-size="10.5" fill="#222">8  RST/PD (activo en bajo)</text>
  <rect x="982" y="493" width="30" height="18" rx="9" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/>
  <text x="997" y="506" font-size="11" fill="#0d47a1" font-weight="bold" text-anchor="middle">PD</text>
  <text x="790" y="524" font-size="10.5" fill="#222">17, 18  BLVDD (luz)</text>
  <rect x="976" y="511" width="44" height="18" rx="9" fill="#ffebee" stroke="#c62828" stroke-width="1.3"/>
  <text x="998" y="524" font-size="11" fill="#b71c1c" font-weight="bold" text-anchor="middle">5V_P</text>
  <text x="790" y="542" font-size="10.5" fill="#222">19, 20  BLGND</text>
  <rect x="980" y="529" width="34" height="18" rx="9" fill="#f5f5f5" stroke="#616161" stroke-width="1.3"/>
  <text x="997" y="542" font-size="11" fill="#424242" font-weight="bold" text-anchor="middle">GND</text>
  <text x="790" y="558" font-size="10" fill="#666">9 a 16 sin conectar</text>

  <!-- Alimentación -->
  <rect x="1046" y="334" width="240" height="232" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="1.6"/>
  <text x="1056" y="354" font-size="12" fill="#e65100" font-weight="bold">Alimentación (de la caja)</text>
  <text x="1056" y="378" font-size="10.5" fill="#222">SP13 1 (marrón, J3-1 de la caja)</text>
  <text x="1056" y="394" font-size="10.5" fill="#222">  → PANT_IN</text>
  <text x="1056" y="412" font-size="10.5" fill="#222">D11 TVS (raya a PANT_IN) y</text>
  <text x="1056" y="428" font-size="10.5" fill="#222">C12 47 µF 50 V, a GND</text>
  <text x="1056" y="446" font-size="10.5" fill="#222">U16 D24V10F5: VIN ← PANT_IN</text>
  <text x="1056" y="462" font-size="10.5" fill="#222">  VOUT → 5V_P (1 A)</text>
  <text x="1056" y="480" font-size="10.5" fill="#222">D12 1N5819: 5V_P → VUSB</text>
  <text x="1056" y="496" font-size="10.5" fill="#222">  (raya hacia VUSB)</text>
  <text x="1056" y="514" font-size="10.5" fill="#222">SP13 2 (blanco) → GND</text>
  <text x="1056" y="536" font-size="10" fill="#666">Sin batería: se enciende y se</text>
  <text x="1056" y="550" font-size="10" fill="#666">apaga con la caja (F2 en la caja)</text>

  <!-- U17 y U13 -->
  <rect x="780" y="586" width="250" height="150" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <text x="790" y="606" font-size="12" fill="#1565c0" font-weight="bold">U17 74AHCT125 y U13 LEDs</text>
  <text x="790" y="628" font-size="10.5" fill="#222">U17 2 (1A) ← LED_3V3</text>
  <text x="790" y="644" font-size="10.5" fill="#222">U17 3 (1Y) → R11 470 Ω → U13 DIN</text>
  <text x="790" y="660" font-size="10.5" fill="#222">U17 14 ← 5V_P (C13 100 nF a GND)</text>
  <text x="790" y="676" font-size="10.5" fill="#222">U17 7 y 1 → GND · 4, 10, 13 → 5V_P</text>
  <text x="790" y="692" font-size="10.5" fill="#222">U17 5, 9, 12 → GND</text>
  <text x="790" y="710" font-size="10.5" fill="#222">U13 5VDC ← 5V_P (C11 100 µF a GND)</text>
  <text x="790" y="726" font-size="10" fill="#666">LEDs a la mitad de brillo como mucho</text>

  <!-- Botones -->
  <rect x="1046" y="586" width="240" height="150" rx="4" fill="#fafafa" stroke="#455a64" stroke-width="1.6"/>
  <text x="1056" y="606" font-size="12" fill="#455a64" font-weight="bold">SW1, SW2 · pulsadores</text>
  <text x="1056" y="630" font-size="10.5" fill="#222">SW1 (A) → BTN_A</text>
  <text x="1056" y="648" font-size="10.5" fill="#222">SW2 (B) → BTN_B</text>
  <text x="1056" y="666" font-size="10.5" fill="#222">el otro terminal → GND</text>
  <text x="1056" y="684" font-size="10" fill="#666">pull-up interna del ESP32</text>

  <text x="780" y="770" font-size="11" fill="#455a64">La luz de la pantalla la regula el propio BT817 por SPI, con el sensor de luz:</text>
  <text x="780" y="786" font-size="11" fill="#455a64">al 100 % a pleno sol, baja de noche.</text>
  <text x="780" y="806" font-size="11" fill="#455a64">Con el contacto quitado, la caja sigue encendida hasta 15 min esperando al móvil:</text>
  <text x="780" y="822" font-size="11" fill="#455a64">la pantalla se queda a oscuras (luz a 0 y LEDs apagados).</text>
  <text x="780" y="842" font-size="11" fill="#455a64">El USB de U11, solo con la unidad sin corriente (como en la caja).</text>
  <text x="780" y="862" font-size="11" fill="#455a64">Entre la pantalla y la Break Out Board, el cable plano que trae: no otro.</text>
  <text x="780" y="882" font-size="11" fill="#455a64">El cable de la caja es de 3 hilos: el verde (botón del manillar) no se usa aquí.</text>
</svg>
